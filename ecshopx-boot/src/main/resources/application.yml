server:
  port: 18080            # 本机 8080 被占用（见环境备忘）

spring:
  application:
    name: kotlin-ecshopx
  datasource:
    url: jdbc:h2:file:./data/ecshopx;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: embedded     # schema.sql/seed.sql 来自 ecshopx-dao jar（classpath:sql/），均已幂等化
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/seed.sql
  jackson:
    default-property-inclusion: non_null

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

ecx:
  compat:
    force-ok-status: false
  seq:
    node: 1
    step: 100
