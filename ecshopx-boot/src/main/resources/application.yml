server:
  port: 18080            # 本机 8080 被占用（见环境备忘）

spring:
  application:
    name: kotlin-ecshopx
  datasource:
    url: jdbc:h2:file:./data/ecshopx;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    driver-class-name: org.h2.Driver
  sql:
    init:
      # 实测：fat jar + H2 file 库下 mode=embedded 会静默跳过脚本（mem 单测正常）；
      # schema/seed 已全部幂等化（IF NOT EXISTS / INSERT IGNORE / GREATEST），故用 always。
      mode: always
      # 脚本含中文演示数据，Windows 平台默认字符集（GBK）会读成乱码 → 显式 UTF-8
      encoding: UTF-8
      # classpath* 才能解析到嵌套 jar（BOOT-INF/lib/ecshopx-dao.jar!/sql/*.sql）中的脚本
      schema-locations: classpath*:/sql/schema.sql
      data-locations: classpath*:/sql/seed.sql
  jackson:
    # 出参保留显式 null（源系统 Fractal 会输出 null 字段，GOODS 商品行的
    # barcode/brief/weight 等空值字段必须存在，契约测试按字段集合 diff）
    default-property-inclusion: always
  servlet:
    multipart:
      # Spring 默认单文件 1MB，M0-8 的 SUP-2 与 ecx.upload.max-size 对齐
      max-file-size: 5MB
      max-request-size: 6MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

ecx:
  compat:
    force-ok-status: false
  pay:
    # M1-2 渠道 profile：mock（缺省，M0 假渠道，测试与冒烟脚本口径不变）| wechatpay | alipay | 逗号叠加
    # 真渠道要在这里改，不在代码里改：换 profile 就换实现，PayChannelRegistry 只注册被启用的渠道
    active-channel-profile: ${ECX_PAY_PROFILE:mock}
    wxpay:
      # 全部留空 = 未配置；配了 profile=wechatpay 却缺项，第一次下单会报"配置不全"而不是启动失败
      mch-id: ${ECX_WX_MCH_ID:}
      app-id: ${ECX_WX_APP_ID:}
      api-v3-key: ${ECX_WX_API_V3_KEY:}
      # 私钥与证书：内联 PEM（配置中心下发）或文件路径二选一，路径优先读文件
      private-key: ${ECX_WX_PRIVATE_KEY:}
      private-key-path: ${ECX_WX_PRIVATE_KEY_PATH:}
      certificate-serial: ${ECX_WX_CERT_SERIAL:}
      platform-certificate: ${ECX_WX_PLATFORM_CERT:}
      platform-certificate-path: ${ECX_WX_PLATFORM_CERT_PATH:}
      # 回调地址要公网可达；本地仿真/企业网关用 base-url 覆盖 SDK 的固定域名（路径与签名不变）
      notify-url: ${ECX_WX_NOTIFY_URL:http://127.0.0.1:18080/api/notify/wxpay}
      refund-notify-url: ${ECX_WX_REFUND_NOTIFY_URL:}
      base-url: ${ECX_WX_BASE_URL:}
      # 演示与仿真兜底 openid：仅在会员没绑微信（members_associations 无行）时生效，生产必须留空
      fallback-open-id: ${ECX_WX_FALLBACK_OPEN_ID:}
    alipay:
      server-url: ${ECX_ALIPAY_SERVER_URL:https://openapi.alipay.com/gateway.do}
      app-id: ${ECX_ALIPAY_APP_ID:}
      private-key: ${ECX_ALIPAY_PRIVATE_KEY:}
      alipay-public-key: ${ECX_ALIPAY_PUBLIC_KEY:}
      notify-url: ${ECX_ALIPAY_NOTIFY_URL:http://127.0.0.1:18080/api/notify/alipay}
  seq:
    node: 1
    step: 100
  security:
    jwt-secret: M0-dev-secret-change-me-0123456789abcdef
    jwt-ttl-seconds: 43200
    login-captcha: false      # true 时 AUTH-1 需 yzm=8888（M0 mock）
    sms-mock-code: "8888"     # M0 短信验证码固定值，P1 接真实通道
  upload:
    # SUP-2 本地存储根目录（相对启动目录）；url 前缀与 boot 侧静态映射共用同一配置
    root: data/storage
    url-prefix: /storage
    max-size: 5242880         # 5MB，与 spring.servlet.multipart.max-file-size 对齐
